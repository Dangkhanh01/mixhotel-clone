<!-- wp:html -->
<div id="mixMobileActionBarWrapper">
  <nav aria-label="Thanh thao tác cố định mobile" class="menuEndPage">
    <!-- 1. Trang chủ -->
    <div class="smallPart homePart">
      <a href="/" class="aTag" title="Trang chủ">
        <img src="/wp-content/themes/mixhotel-theme/assets/images/icon-home.svg" alt="Trang chủ" width="24" height="24" />
      </a>
      <div class="textUnderItem">Trang chủ</div>
    </div>

    <!-- 2. Messenger -->
    <div class="smallPart messFacePart">
      <button type="button" class="aTag" data-contact-action="messenger" aria-label="Nhắn tin qua Messenger">
        <img src="/wp-content/themes/mixhotel-theme/assets/images/icon-messenger-bottom.svg" alt="Messenger" width="24" height="24" />
      </button>
      <div class="textUnderItem">Messenger</div>
    </div>

    <!-- 3. Phone (Nút tròn vàng nhô cao ở chính giữa có pulse và wobble) -->
    <div class="smallPart centerPart phonePart">
      <div class="phoneBtnWrapper">
        <button type="button" class="phoneBtn" data-contact-action="phone" aria-label="Gọi điện đặt phòng ngay">
          <div class="phoneIconInner">
            <img src="/wp-content/themes/mixhotel-theme/assets/images/icon-phone-bottom.svg" alt="Hotline" width="24" height="24" />
          </div>
        </button>
      </div>
      <div class="textUnderItem">Phone</div>
    </div>

    <!-- 4. Zalo -->
    <div class="smallPart zaloPart">
      <button type="button" class="aTag" data-contact-action="zalo" aria-label="Nhắn Zalo tư vấn phòng">
        <img src="/wp-content/themes/mixhotel-theme/assets/images/icon-zalo-bottom.png" alt="Zalo" width="24" height="24" />
      </button>
      <div class="textUnderItem">Zalo</div>
    </div>

    <!-- 5. Tin nhắn SMS -->
    <div class="smallPart inboxPart">
      <button type="button" class="aTag" data-contact-action="sms" aria-label="Gửi SMS">
        <img src="/wp-content/themes/mixhotel-theme/assets/images/icon-sms.svg" alt="SMS" width="24" height="24" />
      </button>
      <div class="textUnderItem">Tin nhắn</div>
    </div>
  </nav>
</div>
<!-- /wp:html -->
